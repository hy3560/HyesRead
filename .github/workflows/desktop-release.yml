name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis
      - name: Install, launch, and uninstall the Windows EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The Windows EXE installer was not produced.' }
          ./scripts/test-nsis-installer.ps1 -InstallerPath $installer.FullName
      - name: Save Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check Android signing secrets
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEY_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_STORE_PASSWORD" ]]; then
            echo "Android release signing secrets are not configured; no release assets will be published." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Android release signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key_dir="$RUNNER_TEMP/hyesread-android-signing"
          mkdir -p "$key_dir"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$key_dir/release.jks"
          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storeFile=%s\n' "$key_dir/release.jks"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
      - name: Build Android APK and Play bundle
        run: pnpm exec tauri android build --apk --aab --target aarch64 --ci
      - name: Verify Android APK signature
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
      - name: Verify Android AAB signature
        run: |
          set -euo pipefail
          aab="$(find src-tauri/gen/android/app/build/outputs/bundle/universalRelease -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$aab"
          verification="$(jarsigner -J-Duser.language=en -verify -verbose -certs "$aab")"
          printf '%s\n' "$verification"
          grep -q 'jar verified\.' <<< "$verification"
      - name: Collect Android release files
        run: |
          set -euo pipefail
          mkdir -p android-release-assets
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk/universal/release -maxdepth 1 -name '*.apk' -type f)
          mapfile -t aabs < <(find src-tauri/gen/android/app/build/outputs/bundle/universalRelease -maxdepth 1 -name '*.aab' -type f)
          [[ ${#apks[@]} -eq 1 && ${#aabs[@]} -eq 1 ]]
          cp "${apks[0]}" "${aabs[0]}" android-release-assets/
      - name: Save Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android-release-assets/*.apk
            android-release-assets/*.aab
          if-no-files-found: error
      - name: Remove Android release signing material
        if: always()
        run: rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/hyesread-android-signing/release.jks"

  publish:
    runs-on: ubuntu-latest
    needs:
      - windows
      - android
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release metadata directory
        run: mkdir -p release-assets
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Download verified Windows EXE installer
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-assets/windows
      - name: Download verified Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets/android
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum release-assets/windows/*-setup.exe release-assets/android/*.apk release-assets/android/*.aab release-assets/sbom.spdx.json > release-assets/SHA256SUMS.txt
      - name: Publish complete release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            HyesRead ${{ github.ref_name }} for Windows x64 and Android ARM64.

            Windows: download the setup EXE and follow the installer.
            Android: use the signed APK for direct installation or the signed AAB for Google Play distribution.
            Supply chain: SHA-256 checksums and an SPDX JSON SBOM are included with every complete release.
          files: |
            release-assets/windows/*-setup.exe
            release-assets/android/*.apk
            release-assets/android/*.aab
            release-assets/SHA256SUMS.txt
            release-assets/sbom.spdx.json
          overwrite_files: true
          fail_on_unmatched_files: true
