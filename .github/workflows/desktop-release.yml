name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Android phone APK
        run: pnpm exec tauri android build --apk --target aarch64 --ci
      - name: Publish Android APK to release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Android ARM64 phone APK and Windows x64 installer for HyesRead ${{ github.ref_name }}.

            Android: download the APK and install it on an ARM64 Android phone.
            Windows: download the MSI, install it, and open HyesRead from the Start menu.
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        run: pnpm tauri build --bundles msi
      - name: Install, launch, and uninstall the Windows MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'The Windows MSI was not produced.' }
          ./scripts/test-installer.ps1 -MsiPath $msi.FullName
      - name: Publish release with installer
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Windows x64 installer for HyesRead ${{ github.ref_name }}.

            Download the MSI below, install it, and open HyesRead from the Start menu.
          files: src-tauri/target/release/bundle/msi/*.msi
