name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        run: pnpm tauri build --bundles msi
      - name: Install, launch, and uninstall the Windows MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'The Windows MSI was not produced.' }
          ./scripts/test-installer.ps1 -MsiPath $msi.FullName
      - name: Save Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check Android signing secrets
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEY_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_STORE_PASSWORD" ]]; then
            echo "Android release signing secrets are not configured; no release assets will be published." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Android release signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key_dir="$RUNNER_TEMP/hyesread-android-signing"
          mkdir -p "$key_dir"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$key_dir/release.jks"
          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storeFile=%s\n' "$key_dir/release.jks"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
      - name: Build Android phone APK
        run: pnpm exec tauri android build --apk --target aarch64 --ci
      - name: Verify Android APK signature
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
      - name: Save Android installer
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
      - name: Remove Android release signing material
        if: always()
        run: rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/hyesread-android-signing/release.jks"

  publish:
    runs-on: ubuntu-latest
    needs:
      - windows
      - android
    steps:
      - name: Download verified Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: release-assets/windows
      - name: Download verified Android installer
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/android
      - name: Publish complete release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            HyesRead ${{ github.ref_name }} for Windows x64 and Android ARM64.

            Windows: download the MSI, install it, and open HyesRead from the Start menu.
            Android: download the APK and install it on an ARM64 Android phone.
          files: |
            release-assets/windows/*.msi
            release-assets/android/*.apk
          overwrite_files: true
          fail_on_unmatched_files: true
