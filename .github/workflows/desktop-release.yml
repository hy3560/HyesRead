name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        run: pnpm tauri build --bundles msi
      - name: Publish release with installer
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Windows x64 installer for HyesRead ${{ github.ref_name }}.

            Download the MSI below, install it, and open HyesRead from the Start menu.
          files: src-tauri/target/release/bundle/msi/*.msi
