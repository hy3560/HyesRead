name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --registry=https://registry.npmjs.org
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --bundles msi
      - name: Install WebView2 Runtime for native acceptance
        shell: pwsh
        run: |
          $runtimeId = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $runtimeKeys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$runtimeId",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$runtimeId"
          )
          $runtimeVersion = $null
          foreach ($runtimeKey in $runtimeKeys) {
            $candidate = (Get-ItemProperty -Path $runtimeKey -Name pv -ErrorAction SilentlyContinue).pv
            if ($candidate -and [version]$candidate -gt [version]'0.0.0.0') {
              $runtimeVersion = $candidate
              break
            }
          }

          if (-not $runtimeVersion) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $installer = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($installer.ExitCode -ne 0) {
              throw "WebView2 Runtime installation failed with exit code $($installer.ExitCode)."
            }

            foreach ($runtimeKey in $runtimeKeys) {
              $candidate = (Get-ItemProperty -Path $runtimeKey -Name pv -ErrorAction SilentlyContinue).pv
              if ($candidate -and [version]$candidate -gt [version]'0.0.0.0') {
                $runtimeVersion = $candidate
                break
              }
            }
          }

          if (-not $runtimeVersion) { throw 'WebView2 Runtime is unavailable after installation.' }
          Write-Host "WebView2 Runtime: $runtimeVersion"
      - run: pnpm test:native
      - name: Install, launch, and uninstall the Windows MSI
        id: msi_acceptance
        shell: pwsh
        continue-on-error: true
        run: |
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'The Windows MSI was not produced.' }
          ./scripts/test-installer.ps1 -MsiPath $msi.FullName
      - name: Fail when MSI acceptance fails
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.msi_acceptance.outcome }}' -eq 'failure') { throw 'Windows MSI lifecycle acceptance failed; see the job summary for the failing stage.' }
