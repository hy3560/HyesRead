[package]
name = "hyes-read"
version = "0.1.16"
edition = "2021"

[lib]
name = "hyes_read_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.1.1", features = ["protocol-asset"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-store = "2.0.0" 
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
opener = { version = "0.7.1", features = ["reveal"] }
reqwest = { version = "0.13.3", features = ["stream", "rustls"] }
quick-xml = "0.39.3"
url = "2.5.8"
tokio = { version = "1.52.2", features = ["fs", "io-util"] }

epub = "2.1"
mobi = "0.2"
lopdf = "0.34" 
zip = "0.6"

base64 = "0.22"
walkdir = "2.5.0"
rayon = "1.12.0"

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
